# Cuts CampOracle's offline map regions from the newest Protomaps daily build
# of OpenStreetMap, builds each region's road routing tiles (Valhalla, from the
# Geofabrik extract), and publishes them as this repository's latest release,
# where the app downloads them. Runs on the 2nd of each month, or by hand.

name: Offline map regions

on:
  schedule:
    - cron: '0 18 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pmtiles
        run: |
          curl -sSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin pmtiles
          pmtiles version
      - name: Cut the regions
        run: node scripts/build-map-regions.mjs --out build/map-regions
      - name: Build the routing tiles
        run: node scripts/build-routing-tiles.mjs --out build/map-regions --work build/valhalla
      # The web planner's routing container fetches loose tiles from R2 (scripts/upload-routing-tiles.mjs). Skipped
      # until the bucket's credentials are in the repository's secrets.
      - name: Upload the routing tiles to R2
        if: env.HAS_R2 == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ROUTING_BUCKET: camporacle-routing-tiles
        run: |
          curl -sSfL -o rclone.zip https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-linux-amd64.zip
          unzip -q -j rclone.zip 'rclone-v1.76.0-linux-amd64/rclone' -d /usr/local/bin
          rclone version
          node scripts/upload-routing-tiles.mjs --tiles build/valhalla/tiles --manifest build/map-regions/regions.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(node -p "require('./build/map-regions/regions.json').build")
          NOTES="Map data © OpenStreetMap contributors, under the Open Database Licence 1.0 (https://www.openstreetmap.org/copyright). Maps cut from the Protomaps daily build $BUILD at zoom 15; routing tiles built with Valhalla from the Geofabrik extract."
          # A run on the same Protomaps build replaces that release's files rather than failing on its tag.
          if gh release view "osm-$BUILD" > /dev/null 2>&1; then
            gh release upload "osm-$BUILD" build/map-regions/* --clobber
            gh release edit "osm-$BUILD" --notes "$NOTES" --latest
          else
            gh release create "osm-$BUILD" build/map-regions/* \
              --title "OpenStreetMap regions, Protomaps build $BUILD" \
              --notes "$NOTES" \
              --latest
          fi
