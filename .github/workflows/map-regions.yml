# Cuts CampOracle's offline map regions from the newest Protomaps daily build
# of OpenStreetMap, builds each region's road routing tiles (Valhalla, from the
# Geofabrik extract), and publishes them as this repository's latest release,
# where the app downloads them. Runs on the 2nd of each month, or by hand.
#
# Actions are pinned by commit and the downloaded tools by SHA-256. To move a
# tool, change its URL and hash together. The build job reads the repository
# only; the publish job alone can write releases.

name: Offline map regions

on:
  schedule:
    - cron: '0 18 2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install pmtiles
        env:
          PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
        run: |
          curl -sSfL -o "$RUNNER_TEMP/pmtiles.tar.gz" https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          echo "$PMTILES_SHA256  $RUNNER_TEMP/pmtiles.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pmtiles.tar.gz" -C /usr/local/bin pmtiles
          pmtiles version
      - name: Cut the regions
        run: node scripts/build-map-regions.mjs --out build/map-regions
      - name: Build the routing tiles
        run: node scripts/build-routing-tiles.mjs --out build/map-regions --work build/valhalla
      # The web planner's routing container fetches loose tiles from R2 (scripts/upload-routing-tiles.mjs). Skipped
      # until the bucket's credentials are in the repository's secrets.
      - name: Upload the routing tiles to R2
        if: env.HAS_R2 == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ROUTING_BUCKET: camporacle-routing-tiles
          RCLONE_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/rclone.zip" https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-linux-amd64.zip
          echo "$RCLONE_SHA256  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          unzip -q -j "$RUNNER_TEMP/rclone.zip" 'rclone-v1.76.0-linux-amd64/rclone' -d /usr/local/bin
          rclone version
          node scripts/upload-routing-tiles.mjs --tiles build/valhalla/tiles --manifest build/map-regions/regions.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-regions
          path: build/map-regions
          if-no-files-found: error
          retention-days: 1
          # Maps and routing archives are already compressed.
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: map-regions
          path: build/map-regions
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BUILD=$(jq -r .build build/map-regions/regions.json)
          NOTES="Map data © OpenStreetMap contributors, under the Open Database Licence 1.0 (https://www.openstreetmap.org/copyright). Maps cut from the Protomaps daily build $BUILD at zoom 15; routing tiles built with Valhalla from the Geofabrik extract."
          # A run on the same Protomaps build replaces that release's files rather than failing on its tag.
          if gh release view "osm-$BUILD" > /dev/null 2>&1; then
            gh release upload "osm-$BUILD" build/map-regions/* --clobber
            gh release edit "osm-$BUILD" --notes "$NOTES" --latest
          else
            gh release create "osm-$BUILD" build/map-regions/* \
              --title "OpenStreetMap regions, Protomaps build $BUILD" \
              --notes "$NOTES" \
              --latest
          fi
